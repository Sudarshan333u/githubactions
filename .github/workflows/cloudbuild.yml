name: CI/CD to Cloud Run (Artifact Registry - Manual)

on:
  workflow_dispatch:  # Trigger manually from GitHub UI

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔐 Authenticate to Google Cloud using service account key
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 🛠 Install gcloud CLI and set project
    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    # 🚧 Build Docker image and push to Artifact Registry
    - name: Build and Push to Artifact Registry
      run: |
        gcloud builds submit \
          --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-docker-repo/my-app || true

    # 🔗 Optional: print build logs link
    - name: Print Cloud Build Logs Link
      run: |
        echo "Check Cloud Build logs at:"
        echo "https://console.cloud.google.com/cloud-build/builds?project=${{ secrets.GCP_PROJECT_ID }}"

    # 🚀 Deploy to Cloud Run
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy my-app \
          --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-docker-repo/my-app \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated
